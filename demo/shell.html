<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doom Generic · WebAssembly</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #111; color: #eee; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; box-sizing: border-box; }
    main { width: min(100%, 960px); }
    h1 { margin: 0 0 .25rem; font-size: clamp(1.5rem, 4vw, 2.5rem); }
    p { color: #aaa; margin: .25rem 0 1rem; }
    #canvas { width: 100%; aspect-ratio: 8 / 5; display: block; background: #000; image-rendering: pixelated; outline: none; }
    button { margin-top: .75rem; padding: .55rem .9rem; border: 1px solid #555; border-radius: .35rem; background: #222; color: #eee; font: inherit; cursor: pointer; }
    #status { min-height: 1.5em; color: #aaa; font-size: .9rem; }
    kbd { color: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>Doom Generic</h1>
    <p>Classic Doom engine compiled to WebAssembly, running Freedoom Phase 1.</p>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
    <button onclick="document.getElementById('canvas').requestFullscreen()">Fullscreen</button>
    <div id="status">Loading game data…</div>
    <p>Click the game and press <kbd>Enter</kbd> to start. Move: <kbd>↑</kbd><kbd>↓</kbd> or <kbd>W</kbd><kbd>S</kbd> · Turn: <kbd>←</kbd><kbd>→</kbd> · Fire: <kbd>Ctrl</kbd> · Use: <kbd>Space</kbd></p>
  </main>
  <script>
    var statusElement = document.getElementById('status');
    var Module = {
      canvas: document.getElementById('canvas'),
      print: (...args) => console.log(...args),
      printErr: (...args) => console.error(...args),
      setStatus: text => { statusElement.textContent = text; },
      monitorRunDependencies: left => { if (left) statusElement.textContent = 'Loading game data…'; else statusElement.textContent = 'Ready — click the game to play.'; }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
